# Dependency updates.
#
# The @wordpress/* packages are deliberately not upgraded on sight, and that needs saying because
# they generate the most pull requests. The block build externalises every one of them - the bundle
# takes wp.blocks, wp.blockEditor and the rest as arguments and ships none of their code - so the
# installed version supplies types and nothing else. Types from a newer WordPress than the plugin
# supports describe APIs that are not there at runtime, and the compiler then approves code that
# fatals on the oldest site the readme promises to run on.
#
# They are grouped into one pull request instead: still visible, still reviewable, but a deliberate
# decision about which WordPress the types should describe rather than a separate nudge per package
# to take the newest of everything.

version: 2
updates:
  - package-ecosystem: composer
    directory: /plugins/my-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /plugins/my-plugin
    schedule:
      interval: weekly
    groups:
      wordpress-packages:
        patterns:
          - "@wordpress/*"
          - "@types/wordpress__*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
