name: Deploy to WordPress.org

# Deliberately manual: publishing to the plugin directory is irreversible, so it never rides along
# with a tag push by accident.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.2.0)
        required: true

jobs:
  deploy:
    name: SVN deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the free edition
        run: |
          ./bin/wpx up latest
          ./bin/wpx build --edition=free --public-only --verify
          node cli/scripts/validate-public-artifacts.mjs

      # Git tags use the conventional v1.2.0 form, but WordPress.org SVN tags may contain only
      # numbers and periods. workflow_dispatch keeps github.ref on the selected branch, so pass
      # the normalized input explicitly instead of relying on the deploy action to infer it.
      - name: Resolve the SVN version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "SVN_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Publish
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: my-plugin
          VERSION: ${{ env.SVN_VERSION }}
          BUILD_DIR: .wplab/build/my-plugin
          ASSETS_DIR: .wordpress-org
