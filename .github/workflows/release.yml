name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check that the tag matches the plugin version
        run: node cli/scripts/check-public-versions.mjs "$GITHUB_REF_NAME"

      - run: ./bin/wpx up latest
      - run: ./bin/wpx build --edition=both --public-only --verify

      - name: Validate the current public build
        run: node cli/scripts/validate-public-artifacts.mjs

      - uses: softprops/action-gh-release@v3
        with:
          files: .wplab/public-artifacts/*.zip
          generate_release_notes: true
